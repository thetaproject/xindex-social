<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  anim-site: the xindex.io flow, animated in the site's own look (Figtree, the
  "What is an Index Coin?" diagram, the Create Index basket card, coin icons).
  Scenes (spec.scenes, any order, any subset): "create" (basket fills to 100%),
  "buy" (USDC fans out into the assets and joins into one index coin),
  "rebalance" (weights drift, an open auction brings them back; needs "buy" first).
  Deterministic: window.render(t) draws the frame for time t (seconds).
-->
<style>
  @font-face { font-family:'Figtree'; src:url('{{ root }}/assets/site/figtree-var-latin.woff2') format('woff2'); font-weight:300 900; }
  :root { --line:#ffffff14; --line-2:#ffffff24; --muted:#8a8a98; --sub:#9b9ba9; --blue:#3b82f6; --green:#05df72; --red:#f87171; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:675px; background:#000; overflow:hidden; }
  body { font-family:'Figtree',system-ui,sans-serif; color:#fff; -webkit-font-smoothing:antialiased; }
  #root { position:relative; width:1200px; height:675px; }
  .glow { position:absolute; inset:0; background:radial-gradient(900px 420px at 70% -14%, #466eff26, #0000 60%); }
  canvas#dots { position:absolute; left:0; top:0; width:1200px; height:675px; }
  .top { position:absolute; left:64px; right:64px; top:44px; display:flex; justify-content:space-between; align-items:center; }
  .top img { height:30px; }
  .eyebrow { font-size:13px; font-weight:600; letter-spacing:.24em; text-transform:uppercase; color:var(--muted); }
  .left { position:absolute; left:64px; top:132px; width:430px; }
  .hwrap { position:relative; height:176px; }
  .hwrap h1 { position:absolute; left:0; top:0; font-size:46px; line-height:1.08; font-weight:700; letter-spacing:-.02em; }
  h1 em { font-style:normal; color:var(--blue); }
  .steps { margin-top:22px; display:flex; flex-direction:column; gap:14px; }
  .step { display:flex; gap:18px; align-items:flex-start; padding:14px 18px; border:1px solid var(--line); border-radius:16px; background:#0a0a14; }
  .step i { flex:none; width:30px; font-style:normal; font-size:34px; font-weight:600; letter-spacing:-.04em; line-height:1;
    background:linear-gradient(#fff 10%,#7fb0ff 95%); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .step b { display:block; font-size:18px; font-weight:600; line-height:1.3; }
  .step span { display:block; margin-top:2px; font-size:14px; line-height:1.35; color:var(--sub); }
  .foot { position:absolute; left:64px; right:64px; bottom:36px; display:flex; justify-content:space-between; font-size:14px; color:var(--muted); }
  .foot b { color:#d1d5dc; font-weight:600; }
  .stage { position:absolute; left:540px; top:104px; width:596px; height:520px; }
  .scene { position:absolute; inset:0; }
  /* create card */
  .card { position:absolute; left:0; right:0; top:22px; background:linear-gradient(#0b0c16,#090a13); border:1px solid var(--line-2);
    border-radius:24px; padding:26px 26px 22px; box-shadow:0 30px 80px -30px #3b82f659; }
  .card h3 { font-size:22px; font-weight:700; letter-spacing:-.01em; }
  .total { position:absolute; right:26px; top:20px; text-align:right; }
  .total small { display:block; font-size:12px; color:var(--muted); }
  .total b { font-size:38px; font-weight:700; line-height:1; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
  .basket { margin-top:22px; font-size:12px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
  .basket em { font-style:normal; letter-spacing:0; text-transform:none; font-weight:500; margin-left:8px; color:#6b7280; }
  .bar { position:relative; margin-top:12px; height:8px; display:flex; gap:3px; }
  .bar span { display:block; height:8px; border-radius:4px; }
  .rows { margin-top:16px; border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  .row { display:flex; align-items:center; gap:12px; height:52px; padding:0 14px; border-top:1px solid var(--line); }
  .row:first-child { border-top:0; }
  .row img { width:30px; height:30px; border-radius:50%; }
  .row b { font-size:16px; font-weight:600; }
  .row .nm { font-size:14px; color:var(--muted); }
  .row .wt { margin-left:auto; display:flex; align-items:center; gap:7px; color:var(--muted); font-size:14px; }
  .row .pm { width:26px; height:26px; border:1px solid var(--line-2); border-radius:7px; display:grid; place-items:center; color:#d1d5dc; font-size:15px; }
  .row .v { width:52px; height:30px; border:1px solid var(--line-2); border-radius:8px; display:grid; place-items:center; color:#fff; font-size:15px; font-weight:600; font-variant-numeric:tabular-nums; }
  .cta { margin-top:18px; display:flex; justify-content:space-between; align-items:center; }
  .cta .net { font-size:13px; color:var(--muted); }
  .btn { padding:11px 22px; border-radius:999px; background:#fff; color:#020617; font-size:15px; font-weight:600; }
  .btn.ok { background:#05df7222; color:var(--green); box-shadow:inset 0 0 0 1px #05df7255; }
  .cube { position:absolute; width:58px; height:58px; }
  /* flow diagram (xindex.io "What is an Index Coin?") */
  .end { position:absolute; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:4px;
    min-width:236px; padding:14px 24px; background:#ffffff06; border:1px solid #ffffff1a; border-radius:20px; }
  .end .lbl { font-size:13px; color:#ffffff80; }
  .end .big { display:flex; align-items:center; gap:9px; font-size:22px; font-weight:500; line-height:28px; }
  .end .big img { width:26px; height:26px; }
  .end .note { font-size:13px; color:#ffffff73; }
  .coins { position:absolute; left:0; right:0; display:grid; gap:12px; }
  .coins li { list-style:none; display:flex; flex-direction:column; align-items:center; gap:1px; padding:14px 4px 12px; background:#ffffff08; border:1px solid #ffffff1a; border-radius:16px; }
  .coins img { width:34px; height:34px; border-radius:50%; margin-bottom:6px; }
  .coins b { font-size:16px; font-weight:500; }
  .coins em { font-style:normal; font-size:14px; color:#ffffff73; font-variant-numeric:tabular-nums; }
  .coins em.up { color:var(--green); } .coins em.dn { color:var(--red); }
  .coins span { margin-top:5px; font-size:15px; color:#fffc; font-variant-numeric:tabular-nums; }
  svg.paths { position:absolute; left:0; overflow:visible; }
  .ic { position:relative; width:62px; height:62px; border-radius:50%; margin-bottom:6px; }
  .ic > span { position:absolute; inset:3px; border-radius:50%; display:grid; place-items:center;
    background:radial-gradient(circle at 50% 30%,#1a2234,#06080f 70%); box-shadow:inset 0 0 0 1px #ffffff0f, inset 0 1px #ffffff1f; }
  .ic svg { width:18px; height:19px; }
  .tag { position:absolute; left:50%; transform:translateX(-50%); white-space:nowrap; padding:7px 14px; border-radius:999px; font-size:13px; font-weight:600;
    background:#ffffff0d; border:1px solid var(--line-2); color:#d1d5dc; }
  .tag.ok { background:#05df7214; border-color:#05df7255; color:var(--green); }
</style>
</head>
<body>
<div id="root">
  <div class="glow"></div>
  <canvas id="dots" width="1200" height="675"></canvas>
  <div class="top"><img src="{{ root }}/assets/site/xindex-logo.svg" alt="Xindex"><div class="eyebrow">{{ eyebrow or "How an index coin works" }}</div></div>
  <div class="left"><div class="hwrap" id="heads"></div><div class="steps" id="steps"></div></div>
  <div class="stage" id="stage"></div>
  <div class="foot"><span><b>xindex.io</b>&nbsp;&nbsp;·&nbsp;&nbsp;{{ footer or "Illustrative index, not a live product" }}</span><span><b>@Xindexio</b></span></div>
</div>
<script>
const ROOT = {{ root|tojson }};
const A = {{ assets|tojson }};
const SCENES = {{ (scenes or ["create","buy","rebalance"])|tojson }};
const HEADS = {{ (headlines or {})|tojson }};
const STEPS = {{ (steps or [])|tojson }};
const INDEX = {{ (index_name or "Global Core")|tojson }};
const NET = {{ (network or "Ethereum")|tojson }};
const PAY = {{ (pay or 1000)|tojson }};
const PAYSYM = {{ (pay_symbol or "USDC")|tojson }};
const INSIDE = {{ (inside_note or "")|tojson }};
const DUR = {{ (duration or 13)|tojson }};

const clamp=(x)=>Math.min(1,Math.max(0,x));
const ss=(a,b,x)=>{const t=clamp((x-a)/(b-a));return t*t*(3-2*t);};
const ease=(a,b,x)=>{const t=clamp((x-a)/(b-a));return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;};
const lerp=(a,b,t)=>a+(b-a)*t;
const icon=(a)=>`${ROOT}/assets/site/${a.icon.includes('.')?a.icon:'coins/'+a.icon+'.png'}`;
const fmt=(n)=>n.toLocaleString('en-US');
const XMARK='<svg viewBox="0 6.445 22.667 23.556"><path fill="#fff" d="M5.57169 30.0009H0L8.35754 17.7774L0.253259 6.44531H5.95158L13.8026 17.9048L5.57169 30.0009Z"/><path fill="#fff" d="M12.5926 12.4248L15.291 16.0487L22.6667 6.44531H17.095L12.5926 12.4248Z"/><path fill="#fff" d="M12.5926 22.753L14.9312 19.4915L22.6667 30.0009H17.095L12.5926 22.753Z"/></svg>';

// ---- timeline: each scene gets a slot -------------------------------------------------
const LEN={create:5.4,buy:4.6,rebalance:3.0};
const slots={}; let acc=0;
SCENES.forEach(s=>{slots[s]=[acc,acc+LEN[s]]; acc+=LEN[s];});
const HOLD=Math.max(0.8,DUR-acc);           // last frame held, then fade
const END=acc;

// ---- left column -------------------------------------------------------------------------
const DEF_H={create:'Pick the assets.<br><em>Set the weights.</em>',buy:'Pay once.<br><em>Hold one coin.</em>',rebalance:'Prices move.<br><em>Weights come back.</em>'};
const DEF_S={create:['Pick assets and weights','Up to 200 stocks, gold and crypto'],buy:['Pay in USDC or USDT','One transaction buys the whole basket'],rebalance:['Rebalanced by open auction','Back to its weights, no price oracle']};
const heads=document.getElementById('heads'), steps=document.getElementById('steps');
const hEls={}, sEls={};
SCENES.forEach((s,i)=>{
  const h=document.createElement('h1'); h.innerHTML=HEADS[s]||DEF_H[s]; heads.appendChild(h); hEls[s]=h;
  const st=STEPS[i]||DEF_S[s];
  const d=document.createElement('div'); d.className='step'; d.innerHTML=`<i>${i+1}</i><div><b>${st[0]}</b><span>${st[1]}</span></div>`; steps.appendChild(d); sEls[s]=d;
});

// ---- dot-matrix spheres (the site's halftone art, static) -------------------------------
(function dots(){
  const c=document.getElementById('dots').getContext('2d');
  const sph=[[1120,600,150,[247,147,26]],[1000,660,80,[160,108,255]]];
  for(let y=2.5;y<675;y+=5)for(let x=2.5;x<1200;x+=5){
    for(const [cx,cy,r,col] of sph){const dx=(x-cx)/r,dy=(y-cy)/r,q=dx*dx+dy*dy; if(q>1)continue;
      const l=Math.sqrt(1-q), v=clamp(.12+.88*Math.max(0,-.5*dx-.6*dy+.62*l));
      const n=Math.sin(x*12.9898+y*78.233)*43758.5453, j=.82+.36*(n-Math.floor(n));
      const s=1+2.4*v*j; c.fillStyle=`rgba(${col},${(.10+.30*v)*j})`; c.fillRect(x-s/2,y-s/2,s,s); break;}
  }
})();

// ---- scene: create ------------------------------------------------------------------------
const stage=document.getElementById('stage');
let C=null;
if(slots.create){
  const sc=document.createElement('div'); sc.className='scene'; stage.appendChild(sc);
  sc.innerHTML=`<div class="card"><h3>Create New Index</h3>
    <div class="total"><small>Total allocation</small><b id="ctot">0%</b></div>
    <div class="basket">Your basket<em id="ccount">0 of 200</em></div>
    <div class="bar" id="cbar"></div><div class="rows" id="crows"></div>
    <div class="cta"><span class="net">${INDEX} · on ${NET}</span><span class="btn" id="cbtn">Create index</span></div></div>`;
  const bar=sc.querySelector('#cbar'), rows=sc.querySelector('#crows');
  const segs=[], rws=[];
  A.forEach(a=>{
    const s=document.createElement('span'); s.style.background=a.color; bar.appendChild(s); segs.push(s);
    const r=document.createElement('div'); r.className='row';
    r.innerHTML=`<img src="${icon(a)}"><b>${a.sym}</b><span class="nm">${a.name}</span><span class="wt"><span class="pm">–</span><span class="v">0</span>%<span class="pm">+</span></span>`;
    rows.appendChild(r); rws.push(r);
  });
  C={sc,segs,rws,tot:sc.querySelector('#ctot'),cnt:sc.querySelector('#ccount'),btn:sc.querySelector('#cbtn')};
}

// ---- scene: buy (+ rebalance) -------------------------------------------------------------
let B=null;
if(slots.buy){
  const sc=document.createElement('div'); sc.className='scene'; stage.appendChild(sc);
  const W=596, n=A.length, gap=12, colW=(W-gap*(n-1))/n, cx=i=>i*(colW+gap)+colW/2, mid=W/2;
  const Y={pay:0, fan:92, cards:138, join:262, coin:328};
  sc.innerHTML=`<div class="end" style="top:${Y.pay}px"><span class="lbl">You pay</span><b class="big"><img src="${ROOT}/assets/site/coins/${PAYSYM.toLowerCase()}.svg">${fmt(PAY)} ${PAYSYM}</b><span class="note">One transaction</span></div>
    <svg class="paths" id="fan" style="top:${Y.fan}px" width="${W}" height="46"></svg>
    <ul class="coins" id="bcoins" style="top:${Y.cards}px;grid-template-columns:repeat(${n},1fr)"></ul>
    <svg class="paths" id="join" style="top:${Y.join}px" width="${W}" height="66"></svg>
    <div class="end" id="hold" style="top:${Y.coin}px"><span class="ic" id="ic"><span>${XMARK}</span></span><span class="lbl">You hold</span><b class="big">1 index coin</b><span class="note">${INSIDE||A.map(a=>a.sym).join(', ')+' inside'}</span></div>
    <div class="tag" id="tag" style="top:${Y.join+14}px"></div>`;
  const NS='http://www.w3.org/2000/svg', mk=(svg,d,stroke,w)=>{const p=document.createElementNS(NS,'path');p.setAttribute('d',d);p.setAttribute('fill','none');p.setAttribute('stroke',stroke);p.setAttribute('stroke-width',w);svg.appendChild(p);return p;};
  const dot=(svg,col)=>{const c=document.createElementNS(NS,'circle');c.setAttribute('r',3.2);c.setAttribute('fill',col);c.style.filter=`drop-shadow(0 0 6px ${col})`;svg.appendChild(c);return c;};
  const fan=sc.querySelector('#fan'), join=sc.querySelector('#join'), ul=sc.querySelector('#bcoins');
  const fp=[],jp=[],fd=[],jd=[],cards=[];
  A.forEach((a,i)=>{
    fp.push(mk(fan,`M${mid} 0C${mid} 26 ${cx(i)} 20 ${cx(i)} 46`,'#ffffff40',1));
    jp.push(mk(join,`M${cx(i)} 0C${cx(i)} 38 ${mid} 28 ${mid} 66`,a.color,1.6));
    fd.push(dot(fan,'#bcd4ff')); jd.push(dot(join,a.color));
    const li=document.createElement('li'); li.innerHTML=`<img src="${icon(a)}"><b>${a.sym}</b><em>${a.w}%</em><span>$0</span>`; ul.appendChild(li); cards.push(li);
  });
  [...fp,...jp].forEach(p=>{const L=p.getTotalLength();p.dataset.L=L;p.style.strokeDasharray=L;});
  B={sc,fp,jp,fd,jd,cards,ic:sc.querySelector('#ic'),hold:sc.querySelector('#hold'),pay:sc.querySelector('.end'),tag:sc.querySelector('#tag'),ul};
}
function rim(ws,sweep){ // conic rim like the site's index coin, ws in %, sweep 0..1
  let a=0, parts=[]; const tot=ws.reduce((x,y)=>x+y,0)||1;
  ws.forEach((w,i)=>{const s=a/tot*100*sweep, e=(a+w)/tot*100*sweep; parts.push(`#0000 ${s}% ${s+.6}%`,`${A[i].color} ${s+.6}% ${Math.max(s+.6,e-.6)}%`,`#0000 ${Math.max(s+.6,e-.6)}% ${e}%`); a+=w;});
  parts.push(`#ffffff14 ${100*sweep}% 100%`);
  return `conic-gradient(${parts.join(',')})`;
}

// ---- render -------------------------------------------------------------------------------
window.render=function(t){
  // global fade in / out for a clean loop
  const total=END+HOLD; t=Math.min(t,total);
  document.getElementById('root').style.opacity=Math.min(ss(0,.35,t),1-ss(total-.4,total,t));
  // left column: active scene
  let cur=SCENES[0];
  SCENES.forEach(s=>{ if(t>=slots[s][0]-.25) cur=s; });
  SCENES.forEach((s,i)=>{
    const [a,b]=slots[s], on=s===cur;
    const tin=ss(a-.25,a+.15,t), tout=(on)?0:(t>a?1:0);
    hEls[s].style.opacity = on? (i===0?1:tin) : 0;
    hEls[s].style.transform=`translateY(${on?(1-(i===0?1:tin))*10:0}px)`;
    sEls[s].style.opacity = on? 1 : (t>a? .45 : .3);
    sEls[s].style.borderColor = on? '#3b82f666' : '#ffffff14';
    sEls[s].style.boxShadow = on? '0 18px 50px -24px #3b82f6aa' : 'none';
  });
  // create
  if(C){
    const [a,b]=slots.create, k=t-a;
    const vis = slots.buy ? 1-ss(b-.45,b,t) : 1;
    C.sc.style.opacity = (t<b+.01)? vis : 0; C.sc.style.transform=`translateY(${(1-ss(a,a+.4,t))*14}px) scale(${1-0.03*(1-vis)})`;
    let sum=0, shown=0;
    A.forEach((as,i)=>{
      const t0=.35+i*.7, ap=ss(t0,t0+.35,k), wp=ease(t0+.2,t0+.75,k), w=Math.round(as.w*wp);
      C.rws[i].style.display = ap>0? 'flex':'none';
      C.rws[i].style.opacity=ap; C.rws[i].style.transform=`translateY(${(1-ap)*8}px)`;
      C.rws[i].querySelector('.v').textContent=w;
      C.rws[i].querySelector('.v').style.borderColor = (wp>0&&wp<1)?'#3b82f6':'#ffffff24';
      C.segs[i].style.flex=`${as.w*wp} 1 0`; C.segs[i].style.display= wp>0?'block':'none';
      sum+=as.w*wp; if(ap>0)shown++;
    });
    const tot=Math.round(sum);
    C.tot.textContent=tot+'%'; C.tot.style.color= tot>=100?'#05df72':'#fff';
    C.cnt.textContent=`${shown} of 200`;
    const tb=.35+A.length*.7+.45;               // button press
    const press=ss(tb,tb+.12,k)-ss(tb+.12,tb+.3,k);
    C.btn.style.transform=`scale(${1-.06*press})`;
    if(k>tb+.25){C.btn.className='btn ok';C.btn.textContent='✓ Index created';} else {C.btn.className='btn';C.btn.textContent='Create index';}
  }
  // buy
  if(B){
    const [a,b]=slots.buy, k=t-a;
    B.sc.style.opacity=ss(a-.2,a+.25,t); B.sc.style.transform=`translateY(${(1-ss(a-.2,a+.35,t))*14}px)`;
    const fanP=ease(.35,.95,k), joinP=ease(2.0,2.6,k);
    B.fp.forEach((p,i)=>{const L=+p.dataset.L;p.style.strokeDashoffset=L*(1-fanP);
      const q=ss(.45,1.15,k); const d=B.fd[i]; if(q>0&&q<1){const pt=p.getPointAtLength(L*q);d.setAttribute('cx',pt.x);d.setAttribute('cy',pt.y);d.style.opacity=1;}else d.style.opacity=0;});
    B.cards.forEach((li,i)=>{const cp=ss(.9+i*.12,1.3+i*.12,k);li.style.opacity=.25+.75*cp;li.style.transform=`translateY(${(1-cp)*6}px)`;
      li.style.borderColor = cp>0&&k<2.4? `rgba(255,255,255,${.1+.2*cp})`:'#ffffff1a';
      li.querySelector('span').textContent='$'+fmt(Math.round(PAY*A[i].w/100*ease(1.0+i*.12,1.7+i*.12,k)));});
    B.jp.forEach((p,i)=>{const L=+p.dataset.L;p.style.strokeDashoffset=L*(1-joinP);p.style.strokeOpacity=.75;
      const q=ss(2.1,2.75,k); const d=B.jd[i]; if(q>0&&q<1){const pt=p.getPointAtLength(L*q);d.setAttribute('cx',pt.x);d.setAttribute('cy',pt.y);d.style.opacity=1;}else d.style.opacity=0;});
    const hp=ss(2.55,2.95,k); B.hold.style.opacity=.2+.8*hp; B.hold.style.transform=`translateX(-50%) scale(${.96+.04*hp})`;
    B.hold.style.boxShadow= hp>0? `0 0 ${50*hp}px -10px #3b82f680`:'none';
    let ws=A.map(x=>x.w), sweep=ease(2.7,3.4,k);
    B.tag.style.opacity=0;
    // rebalance
    if(slots.rebalance && t>=slots.rebalance[0]){
      const r=t-slots.rebalance[0], dr=ease(.15,.95,r), back=ease(1.55,2.25,r);
      const m=dr*(1-back);
      ws=A.map(x=>lerp(x.w,x.drift,m));
      B.cards.forEach((li,i)=>{const em=li.querySelector('em'); const v=Math.round(ws[i]); em.textContent=v+'%';
        em.className= m>.05? (v>A[i].w?'up':v<A[i].w?'dn':'') : '';
        li.querySelector('span').textContent='$'+fmt(Math.round(PAY*ws[i]/100));});
      const ok=r>1.35;
      B.tag.textContent= ok? (back>=1?'✓ Back to its weights':'Open auction rebalancing…') : 'Prices move';
      B.tag.className= ok&&back>=1? 'tag ok':'tag';
      B.tag.style.opacity=ss(.1,.35,r);
      B.jp.forEach(p=>p.style.strokeOpacity=.35);
    } else B.cards.forEach((li,i)=>{const em=li.querySelector('em');em.textContent=A[i].w+'%';em.className='';});
    B.ic.style.background=rim(ws,sweep);
  }
};
render(0);
</script>
</body>
</html>
