<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Figtree'; src: url('{{ root }}/assets/site/figtree-var-latin.woff2') format('woff2'); font-weight: 300 900; }
  :root {
    --bg: #000; --card: #0a0a14; --cell: #07090f;
    --line: rgba(255,255,255,0.08); --line-2: rgba(255,255,255,0.14);
    --head: #dee1f1; --text: #fff; --text-2: rgb(209,213,220); --text-3: rgb(153,161,175);
    --eyebrow: #8a8a98; --blue: #3b82f6; --blue-soft: #3b82f6; --violet: #8b5cf6; --green: rgb(5,223,114);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 675px; background: var(--bg); overflow: hidden; }
  body { font-family: 'Figtree', system-ui, sans-serif; color: var(--text); -webkit-font-smoothing: antialiased; }
  .frame { position: relative; width: 1200px; height: 675px; padding: 56px 72px; display: flex; flex-direction: column; }
  .glow { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(900px 400px at 50% -10%, rgba(70,110,255,0.14), transparent 60%); }
  .top { position: relative; display: flex; justify-content: space-between; align-items: center; height: 28px; }
  .logo { height: 26px; width: auto; }
  .eyebrow { font-size: 13px; font-weight: 500; letter-spacing: 0.24em; text-transform: uppercase; color: var(--eyebrow); }
  .body { position: relative; flex: 1; display: flex; flex-direction: column; justify-content: center; }
  h1 { font-weight: 700; letter-spacing: -0.02em; color: var(--text); }
  h1 em, .accent { font-style: normal; color: var(--blue-soft); }
  .sub { color: #9b9ba9; font-size: 22px; line-height: 1.45; font-weight: 400; max-width: 900px; }
  .sub b { color: var(--text); font-weight: 500; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; }
  .foot { position: relative; display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: var(--text-3); letter-spacing: 0.02em; }
  .foot .handle { color: var(--text-2); font-weight: 500; }
  {% block style %}{% endblock %}
</style>
</head>
<body>
<div class="frame">
  <div class="glow"></div>
  <div class="top">
    <img class="logo" src="{{ root }}/assets/site/xindex-logo.svg" alt="Xindex">
    {% if eyebrow %}<div class="eyebrow">{{ eyebrow }}</div>{% endif %}
  </div>
  <div class="body">{% block body %}{% endblock %}</div>
  <div class="foot">
    <span>{{ footer or "The index layer for crypto" }}</span>
    <span class="handle">@Xindexio</span>
  </div>
</div>
</body>
</html>
